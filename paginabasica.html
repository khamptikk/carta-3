<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Web</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f4f4;
            color:#333;
        }

        header{
            background:#0078ff;
            color:white;
            padding:20px;
            text-align:center;
        }

        nav{
            background:#005ecc;
            text-align:center;
            padding:10px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-weight:bold;
        }

        .hero{
            max-width:900px;
            margin:40px auto;
            background:white;
            padding:40px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

        .hero h2{
            margin-bottom:15px;
        }

        .hero p{
            margin-bottom:20px;
        }

        button{
            background:#0078ff;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#005ecc;
        }

        footer{
            text-align:center;
            padding:20px;
            margin-top:40px;
            background:#222;
            color:white;
        }
    </style>
</head>
<body>

<header>
    <h1>Mi Sitio Web</h1>
    <p>Una página sencilla hecha con HTML y CSS</p>
</header>

<nav>
    <a href="#">Inicio</a>
    <a href="#">Servicios</a>
    <a href="#">Acerca</a>
    <a href="#">Contacto</a>
</nav>

<section class="hero">
    <h2>¡Bienvenido!</h2>
    <p>
        Esta es una página web básica. Puedes modificar el texto,
        los colores y agregar más contenido.
    </p>

    <button onclick="saludar()">Haz clic aquí</button>
</section>

<footer>
    © 2026 - Mi Primera Página Web
</footer>

<script>
function saludar(){
    alert("¡Hola! Gracias por visitar mi página.");
}
</script>

</body>
</html>
